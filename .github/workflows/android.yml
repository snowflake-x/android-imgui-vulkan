name: Build Android APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest
      - name: Prepare APK files and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VulkanScope-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/VulkanScope-release-unsigned.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/VulkanScope-debug.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/VulkanScope-release-unsigned.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          path: dist/SHA256SUMS.txt
          archive: false
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK files
        uses: actions/download-artifact@v8
        with:
          pattern: VulkanScope-*.apk
          merge-multiple: true
          # APK files are ZIP containers; preserve them without extracting.
          skip-decompress: true
          path: dist
      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS.txt
          path: dist
      - name: Verify APK checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "VulkanScope $RELEASE_TAG" --generate-notes
